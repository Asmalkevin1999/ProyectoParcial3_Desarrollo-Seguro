name: CI/CD Main Pipeline

on:
  push:
    branches:
      - main

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
  SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RENDER_TOKEN: ${{ secrets.RENDER_TOKEN }}
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Notify Telegram - pipeline started
        if: env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token = os.getenv('TELEGRAM_TOKEN')
          chat_id = os.getenv('TELEGRAM_CHAT_ID')
          message = (
              '🚀 Inicio del pipeline CI/CD en main\n'
              f'Repositorio: ${{ github.repository }}\n'
              f'Rama: ${{ github.ref_name }}\n'
              'Ejecutando build, pruebas unitarias y análisis de seguridad.'
          )
          data = urllib.parse.urlencode({'chat_id': chat_id, 'text': message}).encode('utf-8')
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=data, headers={'Content-Type': 'application/x-www-form-urlencoded'})
          urllib.request.urlopen(req, timeout=15)
          PY

      - name: Build and test backend services
        run: |
          set -e
          for service in api-gateway master-service user-service inventory-service sales-service hr-service; do
            echo "=== Backend: $service ==="
            cd backend/$service
            npm install
            if [ "$service" != "api-gateway" ]; then
              export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/testdb"
              npx prisma generate
            fi
            npm run build
            npm run test -- --runInBand
            cd ../..
          done

      - name: Build and test frontend
        run: |
          set -e
          cd frontend/erp-web
          npm install
          npm run build
          npm run test -- --watch=false --browsers=ChromeHeadless || true

  sonarcloud:
    name: SonarCloud analysis
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SonarCloud scan
        uses: sonarsource/sonarcloud-github-action@master
        with:
          args: |
            -Dsonar.login=${{ env.SONAR_TOKEN }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.sources=backend,frontend,ai-detector
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.github/**

      - name: Notify Telegram - SonarCloud success
        if: success() && env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token = os.getenv('TELEGRAM_TOKEN')
          chat_id = os.getenv('TELEGRAM_CHAT_ID')
          message = (
              '✅ SonarCloud Quality Gate superado\n'
              f'Repositorio: ${{ github.repository }}\n'
              f'Rama: ${{ github.ref_name }}\n'
              'El código pasó el análisis estático.'
          )
          data = urllib.parse.urlencode({'chat_id': chat_id, 'text': message}).encode('utf-8')
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=data, headers={'Content-Type': 'application/x-www-form-urlencoded'})
          urllib.request.urlopen(req, timeout=15)
          PY

      - name: Notify Telegram - SonarCloud failure
        if: failure() && env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token = os.getenv('TELEGRAM_TOKEN')
          chat_id = os.getenv('TELEGRAM_CHAT_ID')
          message = (
              '❌ SonarCloud Quality Gate falló\n'
              f'Repositorio: ${{ github.repository }}\n'
              f'Rama: ${{ github.ref_name }}\n'
              'Revisa los hallazgos y corrige los problemas antes de desplegar.'
          )
          data = urllib.parse.urlencode({'chat_id': chat_id, 'text': message}).encode('utf-8')
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=data, headers={'Content-Type': 'application/x-www-form-urlencoded'})
          urllib.request.urlopen(req, timeout=15)
          PY

  ai-security:
    name: Advanced ML/SAST security analysis
    needs: sonarcloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-detector/requirements.txt

      - name: Run AI security scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python ai-detector/src/ci_cd/security_check.py .

  deploy:
    name: Deploy to Railway/Render
    needs: ai-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to PaaS
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RENDER_TOKEN: ${{ secrets.RENDER_TOKEN }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -e
          if [ -n "$RAILWAY_TOKEN" ]; then
            npm install -g railway
            railway login --apiKey "$RAILWAY_TOKEN"
            railway up --yes
          elif [ -n "$RENDER_TOKEN" ]; then
            npm install -g @render/cli
            render login --api-key "$RENDER_TOKEN"
            render deploy --service-id "$RENDER_SERVICE_ID"
          else
            echo "No deploy token configured in GitHub Secrets." >&2
            exit 1
          fi

      - name: Notify Telegram - Deployment success
        if: success() && env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token = os.getenv('TELEGRAM_TOKEN')
          chat_id = os.getenv('TELEGRAM_CHAT_ID')
          message = (
              '🚀 Despliegue exitoso en PaaS\n'
              f'Repositorio: ${{ github.repository }}\n'
              f'Rama: ${{ github.ref_name }}\n'
              'La nueva versión se ha desplegado después de pasar todos los análisis.'
          )
          data = urllib.parse.urlencode({'chat_id': chat_id, 'text': message}).encode('utf-8')
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=data, headers={'Content-Type': 'application/x-www-form-urlencoded'})
          urllib.request.urlopen(req, timeout=15)
          PY

      - name: Notify Telegram - Deployment failure
        if: failure() && env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token = os.getenv('TELEGRAM_TOKEN')
          chat_id = os.getenv('TELEGRAM_CHAT_ID')
          message = (
              '❌ Falló el despliegue en PaaS\n'
              f'Repositorio: ${{ github.repository }}\n'
              f'Rama: ${{ github.ref_name }}\n'
              'Revisa los logs del workflow para corregir el despliegue.'
          )
          data = urllib.parse.urlencode({'chat_id': chat_id, 'text': message}).encode('utf-8')
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=data, headers={'Content-Type': 'application/x-www-form-urlencoded'})
          urllib.request.urlopen(req, timeout=15)
          PY
