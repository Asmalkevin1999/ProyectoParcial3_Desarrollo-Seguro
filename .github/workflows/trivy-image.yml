name: Trivy Docker Image Scan

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

jobs:
  scan-images:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - master-service
          - user-service
          - inventory-service
          - sales-service
          - hr-service

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ matrix.service }} ./backend/${{ matrix.service }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH