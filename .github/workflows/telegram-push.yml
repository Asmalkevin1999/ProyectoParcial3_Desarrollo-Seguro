name: Telegram Push Notifications

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.parse
          import urllib.request

          token = os.getenv('TELEGRAM_TOKEN', '').strip()
          chat_id = os.getenv('TELEGRAM_CHAT_ID', '').strip()

          if not token or not chat_id:
              print('Telegram notification skipped: missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID')
              sys.exit(0)

          repo = os.getenv('GITHUB_REPOSITORY', 'repositorio')
          branch = os.getenv('GITHUB_REF_NAME', 'rama')
          message = (
              f'🚀 Nuevo push en {repo}\n'
              f'Rama: {branch}\n'
              'Evento: push'
          )

          data = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': message,
              'parse_mode': 'HTML',
          }).encode('utf-8')

          req = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=data,
              headers={'Content-Type': 'application/x-www-form-urlencoded'},
          )

          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  response.read()
              print('Telegram notification sent successfully')
          except Exception as exc:
              print(f'Telegram notification failed: {exc}')
              sys.exit(0)
          PY
