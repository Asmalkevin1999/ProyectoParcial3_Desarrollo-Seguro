name: Secure CI/CD

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - master-service
          - user-service
          - inventory-service
          - sales-service
          - hr-service

    defaults:
      run:
        working-directory: backend/${{ matrix.service }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Prisma Generate
        if: matrix.service != 'api-gateway'
        run: npx prisma generate

      - run: npm run build