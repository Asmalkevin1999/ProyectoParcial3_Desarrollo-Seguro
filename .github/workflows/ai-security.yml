name: AI Security Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  ai-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Notify Telegram start
        if: env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.getenv('TELEGRAM_TOKEN', '').strip()
          chat_id = os.getenv('TELEGRAM_CHAT_ID', '').strip()

          if not token or not chat_id:
              raise SystemExit(0)

          message = (
              "🔐 Nuevo push detectado\n"
              f"Repositorio: ${{ github.repository }}\n"
              f"Rama: ${{ github.ref_name }}\n"
              f"Evento: ${{ github.event_name }}\n"
              "Analizando seguridad con IA..."
          )

          data = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': message,
              'parse_mode': 'HTML',
          }).encode('utf-8')

          req = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=data,
              headers={'Content-Type': 'application/x-www-form-urlencoded'},
          )

          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  response.read()
          except Exception as exc:
              print(f'Telegram notification skipped: {exc}')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ai-detector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI security analysis
        working-directory: ai-detector
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/ci_cd/security_check.py ..

      - name: Notify Telegram success
        if: success() && env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.getenv('TELEGRAM_TOKEN', '').strip()
          chat_id = os.getenv('TELEGRAM_CHAT_ID', '').strip()

          if not token or not chat_id:
              raise SystemExit(0)

          message = (
              "✅ Análisis de seguridad completado\n"
              f"Repositorio: ${{ github.repository }}\n"
              f"Rama: ${{ github.ref_name }}\n"
              "No se detectaron alertas críticas en la revisión de IA."
          )

          data = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': message,
              'parse_mode': 'HTML',
          }).encode('utf-8')

          req = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=data,
              headers={'Content-Type': 'application/x-www-form-urlencoded'},
          )

          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  response.read()
          except Exception as exc:
              print(f'Telegram notification skipped: {exc}')
          PY

      - name: Notify Telegram failure
        if: failure() && env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.getenv('TELEGRAM_TOKEN', '').strip()
          chat_id = os.getenv('TELEGRAM_CHAT_ID', '').strip()

          if not token or not chat_id:
              raise SystemExit(0)

          message = (
              "❌ El análisis de seguridad detectó problemas\n"
              f"Repositorio: ${{ github.repository }}\n"
              f"Rama: ${{ github.ref_name }}\n"
              "Revisa el workflow para ver los hallazgos."
          )

          data = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': message,
              'parse_mode': 'HTML',
          }).encode('utf-8')

          req = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=data,
              headers={'Content-Type': 'application/x-www-form-urlencoded'},
          )

          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  response.read()
          except Exception as exc:
              print(f'Telegram notification skipped: {exc}')
          PY
