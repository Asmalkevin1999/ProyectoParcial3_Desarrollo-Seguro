<div class="container py-4">
  <div class="card shadow-sm border-0 rounded-4 p-4">
    <div class="d-flex align-items-center gap-3 mb-3">
      <div class="display-6">{{ icon }}</div>
      <div>
        <h3 class="mb-1">{{ title }}</h3>
        <p class="text-muted mb-0">{{ subtitle }}</p>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <div class="card border-0 bg-light p-3">
          <h6 class="fw-bold mb-2">Estado del módulo</h6>
          <p class="mb-0 text-muted">Este módulo está conectado al menú dinámico del backend.</p>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card border-0 bg-light p-3">
          <h6 class="fw-bold mb-2">Microservicio asociado</h6>
          <p class="mb-0 text-muted">Se expone desde la arquitectura de microservicios del proyecto.</p>
        </div>
      </div>
    </div>
  </div>
</div>
