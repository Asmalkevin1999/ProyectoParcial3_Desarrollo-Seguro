<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow border-0 rounded-4">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <h2 class="fw-bold">ERP Master</h2>
            <p class="text-muted mb-0">Autenticación segura con selección de rol</p>
          </div>

          <div class="text-center mb-4">
            <button class="btn btn-outline-primary btn-sm me-2" (click)="toggleMode()" [class.active]="!isRegisterMode">Login</button>
            <button class="btn btn-outline-primary btn-sm" (click)="toggleMode()" [class.active]="isRegisterMode">Registro</button>
          </div>

          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input class="form-control" [(ngModel)]="username" placeholder="admin" />
          </div>

          <div *ngIf="isRegisterMode" class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input class="form-control" [(ngModel)]="fullName" placeholder="Juan Pérez" />
          </div>

          <div *ngIf="isRegisterMode" class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" [(ngModel)]="email" placeholder="juan@empresa.com" />
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input class="form-control" type="password" [(ngModel)]="password" placeholder="Admin2026!" />
          </div>

          <div *ngIf="isRegisterMode" class="mb-3">
            <label class="form-label">Confirmar contraseña</label>
            <input class="form-control" type="password" [(ngModel)]="confirmPassword" placeholder="Admin2026!" />
          </div>

          <div *ngIf="isRegisterMode" class="mb-3">
            <label class="form-label">Rol</label>
            <select class="form-select" [(ngModel)]="role">
              <option value="Empleado">Empleado</option>
              <option value="Supervisor">Supervisor</option>
              <option value="Administrador">Administrador</option>
            </select>
          </div>

          <div *ngIf="success" class="alert alert-success py-2">{{ success }}</div>
          <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>

          <button class="btn btn-primary w-100" (click)="isRegisterMode ? register() : login()" [disabled]="loading">
            <span *ngIf="!loading">{{ isRegisterMode ? 'Registrar' : 'Ingresar' }}</span>
            <span *ngIf="loading">Procesando...</span>
          </button>

          <div class="mt-3 text-center small text-muted">
            {{ isRegisterMode ? 'Regístrate como empleado para acceder al ERP.' : 'Ingrese con su usuario y contraseña para elegir rol.' }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
