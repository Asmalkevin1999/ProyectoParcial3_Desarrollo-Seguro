<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-4">

<div class="card shadow">

<div class="card-header text-center">

<h3>ERP Login</h3>

</div>

<div class="card-body">

<div class="mb-3">

<label>Usuario</label>

<input

class="form-control"

[(ngModel)]="username">

</div>

<div class="mb-3">

<label>Contraseña</label>

<input

type="password"

class="form-control"

[(ngModel)]="password">

</div>

<button

class="btn btn-primary w-100"

(click)="login()">

Ingresar

</button>

</div>

</div>

</div>

</div>

</div>
