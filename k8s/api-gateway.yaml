apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: parcial3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            - name: NODE_ENV
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: parcial3
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 3005
      targetPort: 3005
      nodePort: 30005
