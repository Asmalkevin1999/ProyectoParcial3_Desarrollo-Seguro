apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-web
  namespace: parcial3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp-web
  template:
    metadata:
      labels:
        app: erp-web
    spec:
      containers:
        - name: erp-web
          image: erp-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: erp-web
  namespace: parcial3
spec:
  type: NodePort
  selector:
    app: erp-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
