apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservations-service
  namespace: parcial3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservations-service
  template:
    metadata:
      labels:
        app: reservations-service
    spec:
      containers:
        - name: reservations-service
          image: reservations-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              value: postgresql://master_user:Master2026!@postgres:5432/master_gateway?schema=public
---
apiVersion: v1
kind: Service
metadata:
  name: reservations-service
  namespace: parcial3
spec:
  selector:
    app: reservations-service
  ports:
    - port: 3001
      targetPort: 3001
